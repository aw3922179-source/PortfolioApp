<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="230" r="260" fill="url(#glow)"/>
  <circle cx="470" cy="130" r="120" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>
  <circle cx="120" cy="470" r="150" fill="#ffffff" opacity="0.08" filter="url(#soft)"/>

  <!-- abstract silhouette -->
  <circle cx="300" cy="245" r="78" fill="#ffffff" opacity="0.92"/>
  <path d="M300 340c-86 0-156 52-172 122-3 13 6 25 20 25h304c14 0 23-12 20-25-16-70-86-122-172-122z" fill="#ffffff" opacity="0.92"/>

  <!-- monogram badge -->
  <g>
    <circle cx="300" cy="510" r="46" fill="#0b1120" opacity="0.85"/>
    <text x="300" y="524" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="34" font-weight="700" letter-spacing="1" fill="#ffffff">AWA</text>
  </g>

  <text x="300" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600" letter-spacing="6" fill="#ffffff" opacity="0.85">ABDUL WASAY ALI</text>
</svg>
